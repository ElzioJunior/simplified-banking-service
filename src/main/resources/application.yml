spring:
  application:
    name: simplified-banking-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/simplified_banking}
    username: ${DATABASE_USERNAME:simplified_banking}
    password: ${DATABASE_PASSWORD:simplified_banking}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      jakarta.persistence.lock.timeout: ${TRANSFER_LOCK_TIMEOUT_MS:5000}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:simplified_banking}
    password: ${RABBITMQ_PASSWORD:simplified_banking}

transfer:
  notifications:
    publisher:
      max-attempts: ${TRANSFER_NOTIFICATION_MAX_ATTEMPTS:3}
      max-duration: ${TRANSFER_NOTIFICATION_MAX_DURATION:3s}
      connection-timeout: ${TRANSFER_NOTIFICATION_CONNECTION_TIMEOUT:1s}
      handshake-timeout: ${TRANSFER_NOTIFICATION_HANDSHAKE_TIMEOUT:1s}
      channel-rpc-timeout: ${TRANSFER_NOTIFICATION_CHANNEL_RPC_TIMEOUT:1s}

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    enabled: true
  paths-to-match: /api/v1/**
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    distribution:
      percentiles-histogram:
        banking.api.request.latency: true
      slo:
        banking.api.request.latency: 50ms,100ms,250ms,500ms,1s,2s

observability:
  prometheus:
    public-scrape-enabled: ${PROMETHEUS_PUBLIC_SCRAPE_ENABLED:false}

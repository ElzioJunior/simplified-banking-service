services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-simplified_banking}
      POSTGRES_USER: ${POSTGRES_USER:-simplified_banking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-simplified_banking}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4.1.4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-simplified_banking}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-simplified_banking}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  application:
    build:
      context: .
    environment:
      SERVER_PORT: 8080
      MANAGEMENT_SERVER_PORT: 8081
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-simplified_banking}
      DATABASE_USERNAME: ${POSTGRES_USER:-simplified_banking}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-simplified_banking}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-simplified_banking}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-simplified_banking}
      TRANSFER_LOCK_TIMEOUT_MS: ${TRANSFER_LOCK_TIMEOUT_MS:-5000}
      TRANSFER_NOTIFICATION_MAX_ATTEMPTS: ${TRANSFER_NOTIFICATION_MAX_ATTEMPTS:-3}
      TRANSFER_NOTIFICATION_MAX_DURATION: ${TRANSFER_NOTIFICATION_MAX_DURATION:-3s}
      TRANSFER_NOTIFICATION_CONNECTION_TIMEOUT: ${TRANSFER_NOTIFICATION_CONNECTION_TIMEOUT:-1s}
      TRANSFER_NOTIFICATION_HANDSHAKE_TIMEOUT: ${TRANSFER_NOTIFICATION_HANDSHAKE_TIMEOUT:-1s}
      TRANSFER_NOTIFICATION_CHANNEL_RPC_TIMEOUT: ${TRANSFER_NOTIFICATION_CHANNEL_RPC_TIMEOUT:-1s}
      PROMETHEUS_PUBLIC_SCRAPE_ENABLED: "true"
    ports:
      - "${SERVER_PORT:-8080}:8080"
    expose:
      - "8081"
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      rabbitmq:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/v3/api-docs"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-7d}"
    ports:
      - "${PROMETHEUS_HOST:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      application:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "promtool", "check", "healthy", "--url=http://localhost:9090"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  grafana:
    image: grafana/grafana:13.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/simplified-banking.json
    ports:
      - "${GRAFANA_HOST:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  postgres-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
